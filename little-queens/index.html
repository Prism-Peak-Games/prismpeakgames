<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Little Queens legal information from Prism Peak Games." />
    <title>Little Queens — Legal</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #26364a; background: #f5f1ff; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; background: radial-gradient(circle at top left, #e2d2ff, transparent 45%), #f5f1ff; }
      main { max-width: 42rem; padding: clamp(2rem, 6vw, 4rem); background: #fff; border-radius: 1.5rem; box-shadow: 0 .8rem 3rem #5742781f; }
      .eyebrow { margin: 0; color: #7253a3; font-size: .8rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: .55rem 0 1rem; color: #664f88; font-size: clamp(2.2rem, 7vw, 4rem); line-height: 1; letter-spacing: -.05em; }
      p { line-height: 1.65; }
      nav { display: grid; gap: .8rem; margin-top: 2rem; }
      a { color: #57398b; font-weight: 750; }
      .card { display: block; padding: 1.1rem 1.25rem; border: 1px solid #dfd2f2; border-radius: .9rem; text-decoration: none; }
      .card:hover, .card:focus-visible { background: #f9f5ff; outline-color: #57398b; }
      .card span { display: block; margin-top: .2rem; color: #64748b; font-weight: 400; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Prism Peak Games</p>
      <h1>Little Queens</h1>
      <p>Legal information for the Little Queens mobile game.</p>
      <nav aria-label="Legal information">
        <a class="card" href="privacy/">Privacy Policy <span>How Little Queens handles information.</span></a>
        <a class="card" href="terms/">Terms and Conditions <span>Rules for using Little Queens.</span></a>
      </nav>
    </main>
  </body>
</html>
